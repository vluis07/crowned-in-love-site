name = "crowned-in-love"
compatibility_date = "2026-01-01"
pages_build_output_dir = "public"

# Create with: wrangler d1 create crowned-in-love-orders
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "crowned-in-love-orders"
database_id = "8db1c54a-6f1a-4a88-a668-8bfd822b6046"

# Create with: wrangler kv namespace create PRODUCTS_CACHE
# then paste the returned id below.
[[kv_namespaces]]
binding = "PRODUCTS_CACHE"
id = "2e78b05405704ad49cdb62b1aee3765f"

[vars]
# Update after your first deploy to your real Pages URL or custom domain.
SITE_URL = "https://crowned-in-love.pages.dev"

# NOT set here on purpose — set these as encrypted secrets instead:
#   wrangler pages secret put PRINTIFY_API_TOKEN
#   wrangler pages secret put PRINTIFY_SHOP_ID
#   wrangler pages secret put STRIPE_SECRET_KEY
#   wrangler pages secret put STRIPE_WEBHOOK_SECRET
