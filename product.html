<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crowned In Love — Product</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .product-grid{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:start;}
  .product-image{aspect-ratio:1;background:var(--blush);border-radius:var(--radius);overflow:hidden;}
  .product-image img{width:100%;height:100%;object-fit:cover;}
  .thumbs{display:flex;gap:10px;margin-top:12px;}
  .thumbs img{width:64px;height:64px;object-fit:cover;border-radius:4px;cursor:pointer;border:1px solid var(--line);}
  select{
    width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);
    font-family:'Poppins',sans-serif;font-size:14px;background:#fff;margin-bottom:20px;
  }
  label{font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--plum-soft);display:block;margin-bottom:8px;}
  .product-price{font-family:'Playfair Display',serif;font-size:26px;margin:14px 0 24px;}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <nav>
      <a href="/" class="logo">
        <svg class="crest" width="26" height="26" viewBox="0 0 60 60"><circle class="ring" cx="30" cy="30" r="27"/><path d="M18 26 L24 34 L30 20 L36 34 L42 26 L40 40 L20 40 Z" fill="var(--gold)"/></svg>
        Crowned In Love
      </a>
      <div class="nav-links"><a href="/#shop">Shop</a><a href="/cart.html">Cart</a></div>
      <div class="nav-actions">
        <a href="/cart.html" class="icon-btn" aria-label="Cart">♡<span class="cart-badge" data-cart-count>0</span></a>
      </div>
    </nav>
  </div>
</header>

<section>
  <div class="wrap" id="product-root">
    <p class="state-msg">Loading product…</p>
  </div>
</section>

<script src="/js/cart.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const productId = params.get('id');
  let product = null;

  function moneyFor(variantId) {
    const v = product.variants.find(v => v.id === variantId);
    return v ? (v.price / 100).toFixed(2) : '—';
  }

  async function loadProduct() {
    const root = document.getElementById('product-root');
    if (!productId) {
      root.innerHTML = '<p class="state-msg">No product specified.</p>';
      return;
    }
    try {
      const res = await fetch(`/api/product/${productId}`);
      product = await res.json();
      if (product.error) throw new Error(product.error);

      const enabledVariants = product.variants.filter(v => v.is_enabled);
      const mainImage = product.images?.[0]?.src || '';

      root.innerHTML = `
        <div class="product-grid">
          <div>
            <div class="product-image"><img id="main-image" src="${mainImage}" alt="${product.title}"></div>
            <div class="thumbs">
              ${(product.images || []).slice(0, 6).map(img => `<img src="${img.src}" onclick="document.getElementById('main-image').src='${img.src}'">`).join('')}
            </div>
          </div>
          <div>
            <h1 style="font-size:clamp(26px,3vw,36px);margin-bottom:10px;">${product.title}</h1>
            <div class="product-price" id="price">$${moneyFor(enabledVariants[0]?.id)}</div>
            <label for="variant-select">Size / option</label>
            <select id="variant-select">
              ${enabledVariants.map(v => `<option value="${v.id}">${v.title}</option>`).join('')}
            </select>
            <button class="btn btn-solid" id="add-to-cart" style="width:100%;justify-content:center;">Add to cart</button>
            <p style="color:var(--plum-soft);font-size:13px;margin-top:16px;">Printed to order and shipped in 3–5 days.</p>
          </div>
        </div>
      `;

      const select = document.getElementById('variant-select');
      select.addEventListener('change', () => {
        document.getElementById('price').textContent = `$${moneyFor(Number(select.value))}`;
      });

      document.getElementById('add-to-cart').addEventListener('click', () => {
        const variantId = Number(select.value);
        const variant = product.variants.find(v => v.id === variantId);
        addToCart({
          product_id: product.id,
          variant_id: variantId,
          title: `${product.title} — ${variant.title}`,
          price: variant.price / 100,
          image: mainImage,
          quantity: 1
        });
        location.href = '/cart.html';
      });
    } catch (err) {
      root.innerHTML = `<p class="state-msg">Couldn't load this product. (${err.message})</p>`;
    }
  }
  loadProduct();
</script>

</body>
</html>
